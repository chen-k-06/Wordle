<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://raw.githubusercontent.com/chen-k-06/Wordle/main/favicon.png" />
</head>

<body>
    <!-- <h1>Wordle</h1> -->
    <div id="board">
        <!-- Top bar -->
        <div class="row" id="top-row">
            <div class="text-box">
                <h1># possibilities / uncertainty</h1>
            </div>
            <div class="empty-box"></div>
            <div class="empty-box"></div>
            <div class="empty-box"></div>
            <div class="empty-box"></div>
            <div class="empty-box"></div>
            <div class="text-box"></div> <!-- filler -->
            <div class="text-box">
                <h1>Top picks --- E[Info]</h1>
            </div>
        </div>

        <!-- row 1 -->
        <div class="row" id="row-0">
            <div class="text-box" id="row-0-pos-bits">2312 possibilities, 11.14 bits remaining</div>

            <div class="box" id="row-0-col-0"></div>
            <div class="box" id="row-0-col-1"></div>
            <div class="box" id="row-0-col-2"></div>
            <div class="box" id="row-0-col-3"></div>
            <div class="box" id="row-0-col-4"></div>
            <div class="text-box" id="row-0-actual-bits"></div>
            <div class="text-box" id="row-0-top-picks">SOARE, 5.89</div>
        </div>

        <!-- row 2 -->
        <div class="row">
            <div class="text-box" id="row-1-pos-bits"></div>

            <div class="box" id="row-1-col-0"></div>
            <div class="box" id="row-1-col-1"></div>
            <div class="box" id="row-1-col-2"></div>
            <div class="box" id="row-1-col-3"></div>
            <div class="box" id="row-1-col-4"></div>
            <div class="text-box" id="row-1-actual-bits"></div>
            <div class="text-box" id="row-1-top-picks">RAISE, 5.88 bits</div>
        </div>

        <!-- row 3 -->
        <div class="row">
            <div class="text-box" id="row-2-pos-bits"></div>

            <div class="box" id="row-2-col-0"></div>
            <div class="box" id="row-2-col-1"></div>
            <div class="box" id="row-2-col-2"></div>
            <div class="box" id="row-2-col-3"></div>
            <div class="box" id="row-2-col-4"></div>
            <div class="text-box" id="row-2-actual-bits"></div>
            <div class="text-box" id="row-2-top-picks">SLATE, 5.85 bits</div>
        </div>

        <!-- row 4 -->
        <div class="row">
            <div class="text-box" id="row-3-pos-bits"></div>

            <div class="box" id="row-3-col-0"></div>
            <div class="box" id="row-3-col-1"></div>
            <div class="box" id="row-3-col-2"></div>
            <div class="box" id="row-3-col-3"></div>
            <div class="box" id="row-3-col-4"></div>
            <div class="text-box" id="row-3-actual-bits"></div>
            <div class="text-box" id="row-3-top-picks">CRATE, 5.83 bits</div>
        </div>

        <!-- row 5 -->
        <div class="row">
            <div class="text-box" id="row-4-pos-bits"></div>

            <div class="box" id="row-4-col-0"></div>
            <div class="box" id="row-4-col-1"></div>
            <div class="box" id="row-4-col-2"></div>
            <div class="box" id="row-4-col-3"></div>
            <div class="box" id="row-4-col-4"></div>
            <div class="text-box" id="row-4-actual-bits"></div>
            <div class="text-box" id="row-4-top-picks">IRATE, 5.83 bits</div>
        </div>

        <!-- row 6 -->
        <div class="row">
            <div class="text-box" id="row-5-pos-bits"></div>

            <div class="box" id="row-5-col-0"></div>
            <div class="box" id="row-5-col-1"></div>
            <div class="box" id="row-5-col-2"></div>
            <div class="box" id="row-5-col-3"></div>
            <div class="box" id="row-5-col-4"></div>
            <div class="text-box" id="row-5-actual-bits"></div>
            <div class="text-box" id="row-5-top-picks">TRACE, 5.83 bits</div>
        </div>
    </div>
    <a href="https://chen-k-06.github.io/Wordle/"> <button>New word</button></a>

    <!-- <button>Test AI bot accuracy</button> -->
    <a href="https://www.nytimes.com/games/wordle/index.html" target="_blank"><button>Use to solve today's
            wordle!</button></a>
    <a href="https://github.com/chen-k-06/Wordle" target="_blank"> <button>Github Repo</button> </a>

    <div id="bot-accuracy-output"></div>
    <h4>Project inspired by 3Blue 1Brown's <a href="https://www.3blue1brown.com/lessons/wordle"
            target="_blank">video</a> and <a
            href="https://www.inspiredpython.com/article/solving-wordle-puzzles-with-basic-python" target="_blank">this
            blog post</a>
    </h4>
    <script defer type="module" src="script.js"></script>
</body>

</html>
